name: CI — Test & Build 🚀

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on the same branch to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Dependency Install & Cache
  # ─────────────────────────────────────────────────────────────────
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cache node_modules for downstream jobs
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Lint Check (oxlint)
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint Check (oxlint)
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Restore cached node_modules
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run oxlint
        id: lint
        run: npm run lint
        continue-on-error: true   # Lint warnings won't break the pipeline

      - name: Lint Result Summary
        run: |
          if [ "${{ steps.lint.outcome }}" == "failure" ]; then
            echo "::warning title=Lint Warnings::Lint check reported issues. Review the output above."
          else
            echo "✅ Lint passed with no issues."
          fi

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Production Build (Vite)
  # ─────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Production Build (Vite)
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify dist output exists
        run: |
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            echo "✅ Build successful! dist/ directory is populated."
            echo "📁 Files generated:"
            find dist -type f | sort
          else
            echo "❌ Build failed: dist/ directory is empty or missing!"
            exit 1
          fi

      - name: Report build size
        run: |
          echo "📊 Build Size Report:"
          du -sh dist/
          echo ""
          echo "📦 Asset breakdown:"
          du -sh dist/assets/* 2>/dev/null || echo "No assets directory found."

      # Upload build artifacts so you can download & inspect them
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build-${{ github.sha }}
          path: dist/
          retention-days: 7   # Keep build artifacts for 7 days

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Merge Conflict Check (PRs only)
  # ─────────────────────────────────────────────────────────────────
  check-conflicts:
    name: 🔀 Merge Conflict Check
    runs-on: ubuntu-latest
    # Only run this for pull requests, not for direct pushes to main/master
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for merge simulation

      - name: Simulate merge with base branch
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          BASE_BRANCH="${{ github.base_ref }}"
          echo "🔍 Checking merge compatibility with: $BASE_BRANCH"

          git fetch origin "$BASE_BRANCH"

          if git merge "origin/$BASE_BRANCH" --no-commit --no-ff; then
            echo "✅ No merge conflicts detected with '$BASE_BRANCH'!"
            git merge --abort 2>/dev/null || true
          else
            echo ""
            echo "❌ MERGE CONFLICT DETECTED with '$BASE_BRANCH'!"
            echo "──────────────────────────────────────────────────"
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U
            echo "──────────────────────────────────────────────────"
            echo "Action required: Pull the latest '$BASE_BRANCH' and resolve conflicts locally before re-opening this PR."
            git merge --abort 2>/dev/null || true
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────
  # Job 5: Final Status Summary
  # ─────────────────────────────────────────────────────────────────
  summary:
    name: 📋 Pipeline Summary
    runs-on: ubuntu-latest
    # Always run summary, even if some jobs failed
    if: always()
    needs: [install, lint, build, check-conflicts]

    steps:
      - name: Print CI Summary
        run: |
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║              CI Pipeline — Final Report              ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  Branch : ${{ github.ref_name }}"
          echo "║  Commit : ${{ github.sha }}"
          echo "║  Actor  : ${{ github.actor }}"
          echo "║  Event  : ${{ github.event_name }}"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  📦 Install       → ${{ needs.install.result }}"
          echo "║  🔍 Lint          → ${{ needs.lint.result }}"
          echo "║  🏗️  Build         → ${{ needs.build.result }}"
          echo "║  🔀 Conflict Check→ ${{ needs.check-conflicts.result }}"
          echo "╚══════════════════════════════════════════════════════╝"

      - name: Set final status
        run: |
          if [ "${{ needs.build.result }}" == "failure" ]; then
            echo "❌ PIPELINE FAILED: Build step failed. Check the build logs."
            exit 1
          elif [ "${{ needs.install.result }}" == "failure" ]; then
            echo "❌ PIPELINE FAILED: Dependency installation failed."
            exit 1
          else
            echo "✅ Pipeline completed successfully!"
          fi
